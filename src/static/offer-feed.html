<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offer Feed by Country</title>
  <!-- Hotjar Tracking Code for Finmatcher AI -->
  <script>
    (function(h,o,t,j,a,r){
        h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
        h._hjSettings={hjid:6748754,hjsv:6};
        a=o.getElementsByTagName('head')[0];
        r=o.createElement('script');r.async=1;
        r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
        a.appendChild(r);
    })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
  </script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --text: #1a1d29;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-dark: #3730a3;
      --pill-bg: #eef2ff;
      --pill-text: #4338ca;

      /* offer-card palette, matched to crezu.mx/landing/offers card design */
      --offer-border: #3abc33;
      --offer-cta: #3abc33;
      --offer-cta-dark: #2f9a29;
      --offer-tag-bg: #edfbec;
      --offer-tag-text: #114510;
      --offer-ribbon-bg: #c4f1c1;
      --offer-ribbon-text: #114510;
      --offer-row-label: rgba(6, 23, 18, 0.6);
      --offer-row-value: #061712;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--offer-border);
      border-radius: 20px;
      padding: 30px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ribbon {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--offer-ribbon-bg);
      color: var(--offer-ribbon-text);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 4px 14px;
      border-radius: 0 19px 0 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--pill-bg);
      flex-shrink: 0;
    }

    .avatar-fallback {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--pill-bg);
      color: var(--pill-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 1px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge.tag {
      background: var(--offer-tag-bg);
      color: var(--offer-tag-text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .detail-label {
      color: var(--offer-row-label);
      flex-shrink: 0;
    }

    .detail-value {
      color: var(--offer-row-value);
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .link-row {
      margin-top: auto;
      padding-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-btn {
      flex: 1;
      text-align: center;
      background: var(--offer-cta);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      border-radius: 14px;
      transition: background 0.15s;
    }

    .view-btn:hover {
      background: var(--offer-cta-dark);
    }

    .continue-wrap {
      max-width: 380px;
      margin: 48px auto 0;
    }

    .continue-card {
      background: var(--card-bg);
      border: 1px solid var(--offer-border);
      border-radius: 20px;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .continue-card .avatar,
    .continue-card .avatar-fallback {
      width: 64px;
      height: 64px;
      font-size: 22px;
    }

    .continue-label {
      font-size: 13px;
      color: var(--muted);
    }

    .continue-card .card-title {
      font-size: 18px;
    }

    .continue-card .view-btn {
      width: 100%;
      margin-top: 6px;
    }

    .text-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    .text-link:hover {
      color: var(--accent);
    }

    .empty, .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      color: #b91c1c;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --card-bg: #1a1d29;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2a2e3a;
        --pill-bg: #262a3a;
        --pill-text: #a5b4fc;

        --offer-border: #2f9a29;
        --offer-cta: #3abc33;
        --offer-cta-dark: #4fd347;
        --offer-tag-bg: #16301a;
        --offer-tag-text: #9be59a;
        --offer-ribbon-bg: #1c3a1f;
        --offer-ribbon-text: #9be59a;
        --offer-row-label: rgba(229, 231, 235, 0.6);
        --offer-row-value: #f1f5f4;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="content"></div>
  </div>

  <script>
    const COUNTRY_NAMES = {
      se: 'Sweden', pl: 'Poland', es: 'Spain', mx: 'Mexico',
      co: 'Colombia', de: 'Germany', kz: 'Kazakhstan', lk: 'Sri Lanka',
      my: 'Malaysia', pe: 'Peru', vn: 'Vietnam', za: 'South Africa',
      ph: 'Philippines', ua: 'Ukraine',
    };

    const FEED_COUNTRIES = Object.keys(COUNTRY_NAMES);

    // "Most popular" translated per country, for the top-ranked offer's ribbon.
    const MOST_POPULAR_LABEL = {
      se: 'Mest populär',
      pl: 'Najpopularniejsza',
      es: 'Más popular',
      mx: 'Más popular',
      co: 'Más popular',
      pe: 'Más popular',
      de: 'Am beliebtesten',
      kz: 'Самый популярный',
      lk: 'වඩාත් ජනප්‍රියම',
      my: 'Paling popular',
      vn: 'Phổ biến nhất',
      za: 'Gewildste',
      ph: 'Pinakasikat',
      ua: 'Найпопулярніший',
    };

    // "Welcome back" / "Continue with" / "Choose another offer", translated per country.
    const CONTINUE_STRINGS = {
      se: { welcome: 'Välkommen tillbaka', continueWith: 'Fortsätt med', chooseAnother: 'Välj ett annat erbjudande' },
      pl: { welcome: 'Witaj ponownie', continueWith: 'Kontynuuj z', chooseAnother: 'Wybierz inną ofertę' },
      es: { welcome: 'Bienvenido de nuevo', continueWith: 'Continuar con', chooseAnother: 'Elegir otra oferta' },
      mx: { welcome: 'Bienvenido de nuevo', continueWith: 'Continuar con', chooseAnother: 'Elegir otra oferta' },
      co: { welcome: 'Bienvenido de nuevo', continueWith: 'Continuar con', chooseAnother: 'Elegir otra oferta' },
      pe: { welcome: 'Bienvenido de nuevo', continueWith: 'Continuar con', chooseAnother: 'Elegir otra oferta' },
      de: { welcome: 'Willkommen zurück', continueWith: 'Weiter mit', chooseAnother: 'Ein anderes Angebot wählen' },
      kz: { welcome: 'С возвращением', continueWith: 'Продолжить с', chooseAnother: 'Выбрать другое предложение' },
      lk: { welcome: 'නැවත සාදරයෙන් පිළිගනිමු', continueWith: 'දිගටම කරගෙන යන්න', chooseAnother: 'වෙනත් දීමනාවක් තෝරන්න' },
      my: { welcome: 'Selamat kembali', continueWith: 'Teruskan dengan', chooseAnother: 'Pilih tawaran lain' },
      vn: { welcome: 'Chào mừng trở lại', continueWith: 'Tiếp tục với', chooseAnother: 'Chọn ưu đãi khác' },
      za: { welcome: 'Welkom terug', continueWith: 'Gaan voort met', chooseAnother: "Kies 'n ander aanbod" },
      ph: { welcome: 'Maligayang pagbabalik', continueWith: 'Magpatuloy kasama ang', chooseAnother: 'Pumili ng ibang alok' },
      ua: { welcome: 'З поверненням', continueWith: 'Продовжити з', chooseAnother: 'Обрати іншу пропозицію' },
    };

    const LAST_OFFER_KEY = 'crezu_offer_feed_last_offer';

    function getSavedOffer() {
      try {
        const raw = localStorage.getItem(LAST_OFFER_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.url === 'string' && typeof parsed.name === 'string') return parsed;
      } catch {
        // localStorage unavailable/corrupted - fall through to the normal feed
      }
      return null;
    }

    function saveLastOffer(offer) {
      try {
        localStorage.setItem(LAST_OFFER_KEY, JSON.stringify({
          name: offer.name,
          avatar: offer.avatar || '',
          url: offer.url,
          country_code: offer.country_code || activeCountry,
        }));
      } catch {
        // localStorage unavailable (private mode, quota) - ignore
      }
    }

    const contentEl = document.getElementById('content');

    function countryFromQuery() {
      const requested = new URLSearchParams(window.location.search)
        .get('country_code')?.toLowerCase();
      return FEED_COUNTRIES.includes(requested) ? requested : FEED_COUNTRIES[0];
    }

    function setCountryQuery(cc, replace) {
      const url = new URL(window.location.href);
      url.searchParams.set('country_code', cc);
      const method = replace ? 'replaceState' : 'pushState';
      history[method](null, '', url);
    }

    let activeCountry = countryFromQuery();
    const cache = new Map();

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    // Forwards every query param this page was opened with (e.g. sub1-sub8, afid,
    // pid, click ids from an ad network) onto each offer's outbound link, so
    // attribution carried on the landing page URL survives into the click-out -
    // except `country_code`, which only controls this page's own feed selection.
    function applyPageQueryParams(offerUrl) {
      const pageParams = new URLSearchParams(window.location.search);
      pageParams.delete('country_code');
      if (![...pageParams.keys()].length) return offerUrl;

      try {
        const u = new URL(offerUrl);
        pageParams.forEach((value, key) => {
          if (value !== '') u.searchParams.set(key, value);
        });
        return u.toString();
      } catch {
        return offerUrl;
      }
    }

    function renderOffers(result) {
      if (result.error) {
        contentEl.innerHTML = `<div class="error">Failed to load offers for ${result.country_code.toUpperCase()}.</div>`;
        return;
      }

      if (!result.items.length) {
        contentEl.innerHTML = `<div class="empty">No offers found for ${result.country_code.toUpperCase()}.</div>`;
        return;
      }

      contentEl.innerHTML = `<div class="grid">
        ${result.items.map((offer, index) => {
          const outboundUrl = applyPageQueryParams(offer.url);
          return `
          <div class="card">
            ${index === 0 ? `<div class="ribbon">&#9733; ${escapeHtml(MOST_POPULAR_LABEL[result.country_code] || 'Most popular')}</div>` : ''}
            <div class="card-head">
              ${offer.avatar
                ? `<img class="avatar" src="${escapeHtml(offer.avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'avatar-fallback', textContent:'${escapeHtml((offer.name || '?')[0])}'}))" />`
                : `<div class="avatar-fallback">${escapeHtml((offer.name || '?')[0])}</div>`
              }
              <div>
                <div class="card-title">${escapeHtml(offer.name)}</div>
                ${offer.offer_type_label ? `<div class="card-subtitle">${escapeHtml(offer.offer_type_label)}</div>` : ''}
              </div>
            </div>
            ${(offer.tags || []).length ? `<div class="badges">
              ${offer.tags.slice(0, 2).map(t => `<span class="badge tag">${escapeHtml(t)}</span>`).join('')}
            </div>` : ''}
            ${(offer.details || []).length ? `<div class="details">
              ${offer.details.map(d => `
                <div class="detail-row">
                  <span class="detail-label">${escapeHtml(d.title)}</span>
                  <span class="detail-value">${escapeHtml(d.value)}</span>
                </div>
              `).join('')}
            </div>` : ''}
            <div class="link-row">
              <a class="view-btn" href="${escapeHtml(outboundUrl)}" target="_blank" rel="noopener noreferrer"
                data-offer-name="${escapeHtml(offer.name)}"
                data-offer-avatar="${escapeHtml(offer.avatar || '')}"
                data-offer-country="${escapeHtml(result.country_code)}"
              >${escapeHtml(offer.button_text)}</a>
            </div>
          </div>
        `;
        }).join('')}
      </div>`;
    }

    function renderContinueScreen(saved) {
      const strings = CONTINUE_STRINGS[saved.country_code] || CONTINUE_STRINGS.es;

      contentEl.innerHTML = `<div class="continue-wrap">
        <div class="continue-card">
          <div class="continue-label">${escapeHtml(strings.welcome)}</div>
          ${saved.avatar
            ? `<img class="avatar" src="${escapeHtml(saved.avatar)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'avatar-fallback', textContent:'${escapeHtml((saved.name || '?')[0])}'}))" />`
            : `<div class="avatar-fallback">${escapeHtml((saved.name || '?')[0])}</div>`
          }
          <div class="card-title">${escapeHtml(saved.name)}</div>
          <a class="view-btn" href="${escapeHtml(saved.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(strings.continueWith)} ${escapeHtml(saved.name)}</a>
          <button class="text-link" id="choose-another">${escapeHtml(strings.chooseAnother)}</button>
        </div>
      </div>`;

      document.getElementById('choose-another').addEventListener('click', () => {
        loadCountry(activeCountry);
      });
    }

    // Delegated so it survives every re-render of #content; only fires for real
    // offer links (they carry data-offer-name), not the continue-screen's own link.
    contentEl.addEventListener('click', (e) => {
      const link = e.target.closest('.view-btn[data-offer-name]');
      if (!link) return;
      saveLastOffer({
        name: link.dataset.offerName,
        avatar: link.dataset.offerAvatar,
        url: link.href,
        country_code: link.dataset.offerCountry,
      });
    });

    async function loadCountry(cc, force = false) {
      if (!force && cache.has(cc)) {
        renderOffers(cache.get(cc));
        return;
      }

      contentEl.innerHTML = `<div class="loading"><div class="spinner"></div>Fetching ${COUNTRY_NAMES[cc]} feed…</div>`;

      try {
        const res = await fetch(`/api/offer-feed?country_code=${encodeURIComponent(cc)}`);
        const data = await res.json();
        const result = (data.countries && data.countries[0]) || { country_code: cc, total: 0, items: [] };
        cache.set(cc, result);
        if (activeCountry === cc) {
          renderOffers(result);
        }
      } catch {
        if (activeCountry === cc) {
          contentEl.innerHTML = `<div class="error">Could not reach the offer feed API.</div>`;
        }
      }
    }

    window.addEventListener('popstate', () => {
      activeCountry = countryFromQuery();
      loadCountry(activeCountry);
    });

    setCountryQuery(activeCountry, true);

    const savedOffer = getSavedOffer();
    if (savedOffer) {
      renderContinueScreen(savedOffer);
    } else {
      loadCountry(activeCountry);
    }
  </script>
</body>
</html>
